name: 🚀 Build and Deploy

on:
  workflow_dispatch:
    inputs:
      lt_version:
        description: "LanguageTool version (e.g. 6.8)"
        required: true
        default: "6.8"
        type: string

permissions:
  contents: read

jobs:
  # ==========================================
  # 🏗️ Build & Push image
  # ==========================================
  build:
    name: 🏗️ Build & Push image
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write # required so this job can request a GitHub OIDC token for Infisical
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch GHCR_TOKEN from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: "oidc"
          identity-id: "77942652-da93-4daa-9f33-62534699496b"
          domain: "https://app.infisical.com"
          project-slug: "homelab-devidence"
          env-slug: "prod"
          secret-path: "/cross"
          export-type: "env"

      - name: Login to ghcr.io
        run: docker login ghcr.io -u ${{ github.actor }} -p "$GHCR_TOKEN"

      - name: "🏗️ Build image ${{ inputs.lt_version }}"
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          docker build \
            --platform linux/${ARCH} \
            --build-arg LT_VERSION=${{ inputs.lt_version }} \
            -t ghcr.io/devidence-dev/languagetool:${{ inputs.lt_version }} \
            .

      - name: "📦 Push ${{ inputs.lt_version }} to GHCR"
        run: |
          docker push ghcr.io/devidence-dev/languagetool:${{ inputs.lt_version }}

      - name: Resolve pushed image digest
        id: digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "ghcr.io/devidence-dev/languagetool:${{ inputs.lt_version }}" | cut -d'@' -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  # ==========================================
  # 🚀 Deploy to production
  # ==========================================
  deploy:
    name: 🚀 Deploy to production
    needs: build
    runs-on: self-hosted
    environment: production
    steps:
      - name: "🚀 Bump homelab to ${{ inputs.lt_version }}"
        env:
          HOMELAB_DEPLOY_TOKEN: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          rm -rf /tmp/homelab-languagetool-deploy
          git clone https://x-access-token:${HOMELAB_DEPLOY_TOKEN}@github.com/devidence-dev/homelab.git /tmp/homelab-languagetool-deploy
          cd /tmp/homelab-languagetool-deploy
          VALUES=kubernetes/internal-apps/languagetool/values.yaml
          sed -i "s|tag: .*|tag: \"${{ inputs.lt_version }}\"|" "$VALUES"
          # Escrito en cada build: si se re-corre con el mismo lt_version (solo cambió la
          # imagen base o el JDK, no la versión de LanguageTool), el tag no cambia pero el
          # digest sí — es lo que le da a ArgoCD un diff real que sincronizar.
          sed -i "s|digest: .*|digest: \"${DIGEST}\"|" "$VALUES"
          git config user.email "ci@devidence.dev"
          git config user.name "homelab-ci"
          git add "$VALUES"
          git diff --staged --quiet && echo "No changes to commit" || (git commit -m "chore(languagetool): bump to ${{ inputs.lt_version }}" && git push)
          rm -rf /tmp/homelab-languagetool-deploy
